<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学びの地図｜子どもの学びポータル</title>
<meta name="description" content="4つのワールドをめぐって学びを進める、宇宙をテーマにした子どもの学びポータル。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#EEF1FF; --subink:#A4ADD6;
    --primary:#FF6B4A;
    --c-math:#4D8BFF; --c-science:#2BD49B; --c-social:#FFC24B; --c-length:#9B7BFF;
    --gold:#FFCB47; --gold-deep:#E0A521; --gold-soft:#5A4A1E;
    --bg-deep:#06081C; --bg-2:#0E1338;
    --line:rgba(255,255,255,.12); --line-soft:rgba(255,255,255,.07);
    --glass:rgba(255,255,255,.055);
    --glass-2:rgba(18,24,58,.55);
    --glass-bd:rgba(255,255,255,.14);
    --shadow:0 18px 44px -18px rgba(0,0,0,.7);
    --shadow-lg:0 30px 70px -22px rgba(0,0,0,.8);
    --shadow-sm:0 10px 26px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
    color:var(--ink); font-size:17px; line-height:1.7; min-height:100vh; font-weight:500;
    background:
      radial-gradient(1100px 760px at 84% -6%, rgba(155,123,255,.30), transparent 58%),
      radial-gradient(1000px 720px at 8% 6%, rgba(77,139,255,.24), transparent 56%),
      radial-gradient(1200px 820px at 50% 116%, rgba(43,212,155,.16), transparent 60%),
      linear-gradient(180deg,#080A24 0%, var(--bg-deep) 40%, #04050F 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  body.big{font-size:20px;}
  body.hide-furi rt{display:none;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px;}
  .num-f{font-feature-settings:"tnum";}
  ruby rt{font-size:.52em;font-weight:700;color:var(--subink);}

  /* ===== 星空 ===== */
  #stars{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;}
  #stars i{position:absolute;border-radius:50%;background:#fff;opacity:.7;
    box-shadow:0 0 6px rgba(255,255,255,.8);animation:tw 3.6s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.22;}50%{opacity:.95;}}

  /* ===== オーロラ（マウスの跡＝星雲のしっぽ） ===== */
  #aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  #aurora b{position:absolute;left:0;top:0;border-radius:50%;filter:blur(40px);
    will-change:transform,opacity;opacity:0;mix-blend-mode:screen;}
  #aurora b:nth-child(1){width:340px;height:340px;background:radial-gradient(circle,rgba(255,107,74,.42),rgba(255,107,74,0) 70%);}
  #aurora b:nth-child(2){width:300px;height:300px;background:radial-gradient(circle,rgba(77,139,255,.40),rgba(77,139,255,0) 70%);}
  #aurora b:nth-child(3){width:262px;height:262px;background:radial-gradient(circle,rgba(43,212,155,.36),rgba(43,212,155,0) 70%);}
  #aurora b:nth-child(4){width:226px;height:226px;background:radial-gradient(circle,rgba(255,203,71,.40),rgba(255,203,71,0) 70%);}
  #aurora b:nth-child(5){width:196px;height:196px;background:radial-gradient(circle,rgba(155,123,255,.40),rgba(155,123,255,0) 70%);}
  #aurora b:nth-child(6){width:166px;height:166px;background:radial-gradient(circle,rgba(77,139,255,.30),rgba(77,139,255,0) 70%);}
  #aurora b:nth-child(7){width:138px;height:138px;background:radial-gradient(circle,rgba(255,107,74,.30),rgba(255,107,74,0) 70%);}

  /* ===== ヘッダー ===== */
  .nav{position:sticky;top:0;z-index:50;background:rgba(6,8,28,.72);
    backdrop-filter:saturate(150%) blur(14px);-webkit-backdrop-filter:saturate(150%) blur(14px);
    border-bottom:1px solid var(--line-soft);}
  .nav-in{max-width:1080px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:12px;}
  .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;}
  .mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(150deg,var(--primary),#FF9A5A);color:#fff;flex:none;
    display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 6px 18px -6px rgba(255,107,74,.9);}
  .mk svg{width:21px;height:21px;display:block;}
  .brand .bt{font-weight:900;font-size:19px;letter-spacing:-.01em;color:var(--ink);}
  .nav .sp{flex:1;}
  .pref{font-size:13.5px;font-weight:800;cursor:pointer;border:1.5px solid var(--line);background:rgba(255,255,255,.06);
    color:var(--subink);border-radius:999px;padding:8px 15px;min-height:44px;white-space:nowrap;
    transition:background .18s,color .18s,border-color .18s,transform .12s;}
  .pref:hover{border-color:rgba(255,255,255,.4);color:var(--ink);}
  .pref:active{transform:scale(.96);}
  .pref.on{background:var(--ink);color:var(--bg-deep);border-color:var(--ink);}

  /* ===== ヒーロー ===== */
  .hero{position:relative;overflow:hidden;padding:46px 0 22px;}
  .hero-in{position:relative;z-index:1;display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
  .hero-main{flex:1;min-width:300px;}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:900;letter-spacing:.08em;
    color:#FFD9A0;background:rgba(255,203,71,.12);border:1.5px solid rgba(255,203,71,.3);
    border-radius:999px;padding:5px 13px;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:16px;}
  .logo .mklg{width:60px;height:60px;border-radius:17px;background:linear-gradient(150deg,var(--primary),#FF9A5A);color:#fff;flex:none;
    display:grid;place-items:center;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 14px 34px -10px rgba(255,107,74,.95);
    animation:powerOn .7s ease-out 1;}
  .logo .mklg svg{width:36px;height:36px;display:block;}
  @keyframes powerOn{0%{transform:scale(.7) rotate(-12deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
  .logo h1{font-size:clamp(44px,6.8vw,72px);font-weight:900;margin:0;line-height:1.02;
    letter-spacing:-.02em;color:#fff;text-shadow:0 2px 30px rgba(120,140,255,.4);}
  .hero-sub{font-size:18px;font-weight:800;color:var(--subink);margin:15px 0 0;}
  body.big .logo h1{font-size:clamp(50px,6.8vw,80px);}

  /* 総ぼうけんレベル：星のランク */
  .crest{flex:none;width:196px;text-align:center;position:relative;}
  .orb{position:relative;width:158px;height:158px;margin:0 auto;display:grid;place-items:center;}
  .orb::before{content:"";position:absolute;inset:14px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #FFF0C2, var(--gold) 46%, var(--gold-deep) 78%, #8A5E12);
    box-shadow:0 0 44px rgba(255,203,71,.55),inset -6px -8px 16px rgba(120,72,0,.5),inset 4px 5px 10px rgba(255,255,255,.6);}
  .orb .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,203,71,.5);
    animation:spin 22s linear infinite;}
  .orb .ring i{position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;
    background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .orb .core{position:relative;z-index:1;line-height:1.0;text-align:center;}
  .orb .core .lv{font-size:42px;font-weight:900;color:#5A3D00;letter-spacing:-.02em;}
  .orb .core .lvlab{font-size:11px;font-weight:900;color:#7A5410;letter-spacing:.04em;}
  .crest .cap{font-size:12.5px;font-weight:900;color:var(--subink);margin-top:11px;}
  .crest .xpbar{height:9px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px auto 0;width:158px;}
  .crest .xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold-deep),var(--gold));
    width:0;transition:width 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(255,203,71,.7);}
  .crest .next{font-size:11px;font-weight:800;color:var(--subink);margin-top:6px;}
  .crest.allclear .orb::before{animation:crestGlow 2.2s ease-in-out infinite;}
  @keyframes crestGlow{0%,100%{box-shadow:0 0 44px rgba(255,203,71,.55),inset -6px -8px 16px rgba(120,72,0,.5),inset 4px 5px 10px rgba(255,255,255,.6);}
    50%{box-shadow:0 0 70px rgba(255,203,71,.95),inset -6px -8px 16px rgba(120,72,0,.5),inset 4px 5px 10px rgba(255,255,255,.8);}}
  .confetti{position:absolute;inset:0;overflow:visible;pointer-events:none;}
  .confetti i{position:absolute;top:42%;left:50%;width:7px;height:11px;border-radius:2px;opacity:0;animation:conf 1.3s ease-out forwards;}
  @keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(320deg);}}

  /* 称号棚 */
  .badges{margin-top:22px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .badges .blab{font-size:12.5px;font-weight:900;color:var(--subink);margin-right:2px;}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:900;
    border-radius:999px;padding:7px 14px;border:1.5px solid var(--line);
    background:rgba(255,255,255,.04);color:#6E76A0;transition:transform .14s;}
  .badge .be{font-size:16px;filter:grayscale(1);opacity:.45;}
  .badge.got{background:linear-gradient(135deg,rgba(255,203,71,.22),rgba(255,203,71,.1));border-color:var(--gold);
    color:#FFE0A0;box-shadow:0 0 20px -6px rgba(255,203,71,.7);}
  .badge.got .be{filter:none;opacity:1;}
  .badge.got:hover{transform:translateY(-2px);}

  /* ===== セクション ===== */
  main{position:relative;z-index:1;}
  section.block{padding:34px 0;scroll-margin-top:76px;}
  .sec-head{display:flex;align-items:center;gap:13px;margin-bottom:8px;}
  .sec-head .ico{width:42px;height:42px;border-radius:13px;background:var(--glass);border:1px solid var(--glass-bd);
    display:grid;place-items:center;font-size:22px;flex:none;}
  .sec-head h2{font-size:clamp(21px,3vw,27px);font-weight:900;margin:0;letter-spacing:-.01em;color:#fff;}
  .sec-sub{font-size:13.5px;font-weight:800;color:var(--subink);margin:0 0 18px 55px;}

  /* ===== ワールド（進度表タイル） ===== */
  .worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .world{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;
    border-radius:22px;overflow:hidden;border:1px solid var(--glass-bd);
    background:var(--glass-2);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:var(--shadow-sm);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s;}
  .world:hover{transform:translateY(-7px);box-shadow:var(--shadow-lg);border-color:rgba(255,255,255,.28);}
  .world:active{transform:translateY(-2px) scale(.995);}
  .world:focus-visible,.pref:focus-visible,.linkcard:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  .world .cover{position:relative;padding:18px 18px 16px;overflow:hidden;color:#fff;
    background:linear-gradient(150deg,var(--tc),var(--tcd));}
  .world.ink .cover{color:#15182C;}
  .world .cover::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120px 80px at 82% 18%, rgba(255,255,255,.4),transparent 60%);}
  .world .crestmini{position:absolute;right:14px;top:13px;font-size:44px;line-height:1;z-index:1;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));transition:transform .25s;}
  .world:hover .crestmini{transform:scale(1.1) rotate(-5deg);}
  .world .lvbadge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;
    background:rgba(10,12,30,.55);color:#fff;border-radius:999px;padding:4px 11px;
    box-shadow:0 4px 10px -5px rgba(0,0,0,.4);backdrop-filter:blur(4px);}
  .world.ink .lvbadge{background:rgba(10,12,30,.75);}
  .world .subj{position:relative;z-index:1;font-size:12.5px;font-weight:900;opacity:.95;margin:11px 0 2px;}
  .world .unit{position:relative;z-index:1;font-size:18px;font-weight:900;line-height:1.3;letter-spacing:-.01em;max-width:80%;}
  .world .body{padding:15px 18px 17px;display:flex;flex-direction:column;gap:11px;flex:1;}

  /* 道（旗） */
  .road{position:relative;height:30px;}
  .road .track{position:absolute;left:2%;right:2%;top:50%;height:5px;border-radius:999px;background:rgba(255,255,255,.13);transform:translateY(-50%);}
  .road .fill{position:absolute;left:2%;top:50%;height:5px;border-radius:999px;background:var(--tc);transform:translateY(-50%);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--tc);}
  .road .nodes{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 1%;}
  .road .node{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);}
  .road .node.done{border-color:var(--tc);background:rgba(255,255,255,.14);}
  .road .node.current{border-color:var(--tc);box-shadow:0 0 0 4px rgba(255,255,255,.06);animation:hop 1.4s ease-in-out infinite;}
  @keyframes hop{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .nudge{font-size:12.5px;font-weight:800;color:var(--subink);}
  .world .core{font-size:12.5px;font-weight:700;color:#C7CEF0;line-height:1.55;
    background:rgba(255,255,255,.05);border-radius:11px;padding:9px 12px;}
  .go{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-size:15px;font-weight:900;color:#fff;background:linear-gradient(150deg,var(--tc),var(--tcd));
    border-radius:13px;padding:12px;box-shadow:0 8px 22px -9px var(--tc);}
  .world.ink .go{color:#15182C;}
  .go .ar{transition:transform .18s;}
  .world:hover .go .ar{transform:translateX(5px);}
  .go.clear{background:linear-gradient(150deg,var(--gold),#FFE08A);color:#5A3D00;}

  /* ===== 教材リンク ===== */
  .links{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;}
  .linkcard{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit;
    background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-bd);border-radius:16px;padding:14px 16px;
    box-shadow:var(--shadow-sm);transition:transform .16s,box-shadow .16s,border-color .16s;}
  .linkcard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3);box-shadow:var(--shadow);}
  .linkcard .li{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--line);
    display:grid;place-items:center;font-size:23px;flex:none;}
  .linkcard .lcol{display:flex;flex-direction:column;flex:1;min-width:0;}
  .linkcard .ln{font-size:15px;font-weight:900;color:var(--ink);}
  .linkcard .ld{font-size:12px;font-weight:700;color:var(--subink);}
  .linkcard .ext{font-size:16px;color:var(--subink);flex:none;}

  /* ===== フッター ===== */
  footer.site{padding:34px 0 48px;}
  footer .ft{font-size:12.5px;font-weight:700;color:var(--subink);text-align:center;line-height:1.9;}
  footer .ft b{color:var(--ink);}

  @media(max-width:760px){
    .worlds{grid-template-columns:1fr;} .links{grid-template-columns:1fr;}
    .hero-in{justify-content:center;text-align:center;} .logo{justify-content:center;}
    .badges{justify-content:center;} .sec-sub{margin-left:0;}
  }
  @media(max-width:560px){
    .wrap{padding:0 16px;} .nav-in{padding:10px 16px;}
    .world .unit{max-width:100%;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
    .world,.go .ar,.crestmini,.road .fill,.world .cover .sheen{transition:none !important;}
    #aurora,#stars{display:none !important;}
  }
</style>
</head>
<body class="hide-furi">

<!-- 星空 ＋ オーロラ（マウスの跡が星雲のしっぽに） -->
<div id="stars" aria-hidden="true"></div>
<div id="aurora" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>

<!-- ヘッダー -->
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="#top">
      <span class="mk"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><polygon points="12,1.5 14.2,9.8 22.5,12 14.2,14.2 12,22.5 9.8,14.2 1.5,12 9.8,9.8"/></svg></span>
      <span class="bt">学びの地図</span>
    </a>
    <span class="sp"></span>
    <button class="pref" id="pf-furi">ふりがな</button>
    <button class="pref" id="pf-big">大きい文字</button>
  </div>
</header>

<a id="top"></a>

<!-- ヒーロー -->
<section class="hero">
  <div class="wrap">
    <div class="hero-in">
      <div class="hero-main">
        <span class="eyebrow" data-furi>🚀 学《まな》びの たんけんへ</span>
        <div class="logo">
          <span class="mklg"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><polygon points="12,1.5 14.2,9.8 22.5,12 14.2,14.2 12,22.5 9.8,14.2 1.5,12 9.8,9.8"/></svg></span>
          <h1>学びの地図</h1>
        </div>
        <p class="hero-sub" data-furi>4つの ワールドを めぐって、じぶんの 学《まな》びを すすめよう。</p>
        <div class="badges" id="badges"></div>
      </div>
      <div class="crest" id="crest"></div>
    </div>
  </div>
</section>

<main>

  <!-- ワールド（進度表） -->
  <section class="block" id="sec-do">
    <div class="wrap">
      <div class="sec-head">
        <span class="ico">🪐</span>
        <h2 data-furi>4つの ワールドを めぐる</h2>
      </div>
      <p class="sec-sub" data-furi>🚀 いまの えき／🚩 クリアした えき。タイルを ひらいて、ぼうけんに でかけよう。</p>
      <div class="worlds" id="grid-units"></div>
    </div>
  </section>

  <!-- 教材リンク -->
  <section class="block">
    <div class="wrap">
      <div class="sec-head">
        <span class="ico">🎒</span>
        <h2 data-furi>こまったら｜ヒントの どうぐ</h2>
      </div>
      <div class="links" id="grid-links"></div>
    </div>
  </section>

</main>

<footer class="site">
  <div class="wrap ft" data-furi>
    制作《せいさく》：<b>紺谷 隆《こんたに たかし》</b>（奈良市立東登美ヶ丘小学校《ならしりつ ひがしとみがおか しょうがっこう》）<br>
    進度《しんど》（色《いろ》ぬり）は つかっている 端末《たんまつ》に 自動保存《じどうほぞん》されます。
  </div>
</footer>

<script>
(function(){
  /* ふりがな */
  var RUBY=/([一-鿿々〇ヶ々ヶ]+)《([^》]+)》/g;
  function toRuby(s){ return String(s).replace(RUBY,"<ruby>$1<rt>$2</rt></ruby>"); }
  document.querySelectorAll("[data-furi]").forEach(function(el){ el.innerHTML=toRuby(el.innerHTML); });
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  /* 設定（ふりがな・大きい文字） */
  var PK="manabi_prefs";
  function lp(){ try{return JSON.parse(localStorage.getItem(PK))||{};}catch(e){return {};} }
  function sp(p){ try{localStorage.setItem(PK,JSON.stringify(p));}catch(e){} }
  var prefs=lp();
  function apply(){
    document.body.classList.toggle("hide-furi", !prefs.furi);
    document.body.classList.toggle("big", !!prefs.big);
    document.getElementById("pf-furi").classList.toggle("on", !!prefs.furi);
    document.getElementById("pf-big").classList.toggle("on", !!prefs.big);
  }
  document.getElementById("pf-furi").onclick=function(){prefs.furi=!prefs.furi;sp(prefs);apply();};
  document.getElementById("pf-big").onclick =function(){prefs.big =!prefs.big; sp(prefs);apply();};
  apply();

  function darken(hex,f){
    var h=hex.replace("#",""); var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    r=Math.round(r*(1-f)); g=Math.round(g*(1-f)); b=Math.round(b*(1-f));
    return "rgb("+r+","+g+","+b+")";
  }
  function doneCount(key){
    try{ var r=localStorage.getItem(key); if(!r) return 0; var o=JSON.parse(r); var d=(o&&o.done)?o.done:{}; var n=0; for(var k in d){if(d[k])n++;} return n; }catch(e){ return 0; }
  }

  /* 教科ワールド（相対パス） */
  var BASE="./";
  var UNITS=[
    {emoji:"🧮",color:"#4D8BFF",ink:false,
     subject:"算数《さんすう》3年《ねん》",
     unit:"たし算《ざん》と ひき算《ざん》の 筆算《ひっさん》",
     core:"位《くらい》を そろえて 計算《けいさん》。お買《か》いもの・バトルの PBLつき。",
     storeKey:"shindo3d_hissan_v6",total:20,path:BASE+"sansu/"},
    {emoji:"📏",color:"#9B7BFF",ink:false,
     subject:"算数《さんすう》3年《ねん》 ⭐クエスト版《ばん》",
     unit:"長《なが》いものの 長《なが》さ（まきじゃく・km）",
     core:"まきじゃくと kmで 長《なが》さを はかる。レベルアップ・ボスせんつき。",
     storeKey:"shindo3d_nagasa_v1",total:20,path:BASE+"sansu-nagasa/"},
    {emoji:"🌱",color:"#2BD49B",ink:false,
     subject:"理科《りか》3年《ねん》",
     unit:"生《い》きものの 育《そだ》ちと つくり",
     core:"すがたは ちがっても、育《そだ》ちの じゅんばんは おなじ。",
     storeKey:"shindo3d_rika3_v1",total:24,path:BASE+"rika/"},
    {emoji:"🗺️",color:"#FFC24B",ink:true,
     subject:"社会《しゃかい》3年《ねん》",
     unit:"わたしたちの 奈良市《ならし》",
     core:"方位《ほうい》と 地図記号《ちずきごう》で 土地《とち》の ようすを 読《よ》む。",
     storeKey:"shindo3d_shakai_nara_v1",total:20,path:BASE+"shakai/"}
  ];

  function roadHTML(c,total){
    var ratio=total>0?c/total:0, doneSt=Math.floor(ratio*5);
    var nodes="";
    for(var i=0;i<5;i++){
      if(i<doneSt) nodes+='<span class="node done">🚩</span>';
      else if(i===doneSt && c<total) nodes+='<span class="node current">🚀</span>';
      else nodes+='<span class="node"></span>';
    }
    var w=Math.round(ratio*100);
    var nudge;
    if(c>=total) nudge="ぜんぶ クリア！🎉";
    else { var nextAt=Math.ceil((doneSt+1)/5*total); var rem=Math.max(1,nextAt-c); nudge="あと "+rem+" マスで はたが たつ！"; }
    return '<div class="road"><div class="track"></div><div class="fill" data-w="'+w+'"></div>'+
      '<div class="nodes">'+nodes+'</div></div><div class="nudge">'+nudge+'</div>';
  }

  /* ===== ワールドタイル ＋ 総ぼうけんレベル ＋ 称号 ===== */
  (function(){
    var g=document.getElementById("grid-units"),html="",sumC=0,sumT=0,allFull=true,allStarted=true;
    UNITS.forEach(function(u){
      var c=Math.min(doneCount(u.storeKey),u.total); sumC+=c; sumT+=u.total;
      if(c<u.total) allFull=false;
      if(c<=0) allStarted=false;
      var tcd=darken(u.color, u.ink?.16:.34);
      var slv=Math.max(1, Math.floor(c/2)+ (c>0?1:0));
      var go=c>=u.total?'<span class="go clear">クリア！ もういちど <span class="ar">→</span></span>'
            :(c>0?'<span class="go">ぼうけんを つづける <span class="ar">→</span></span>'
                 :'<span class="go">ぼうけんに でかける <span class="ar">→</span></span>');
      html+='<a class="world'+(u.ink?' ink':'')+'" href="'+esc(u.path)+'" style="--tc:'+u.color+';--tcd:'+tcd+'">'+
        '<div class="cover">'+
          '<span class="crestmini">'+u.emoji+'</span>'+
          '<span class="lvbadge">⭐ ぼうけんレベル '+(c>0?slv:'-')+'</span>'+
          '<div class="subj">'+toRuby(u.subject)+'</div>'+
          '<div class="unit">'+toRuby(u.unit)+'</div>'+
        '</div>'+
        '<div class="body">'+
          roadHTML(c,u.total)+
          '<div class="core">'+toRuby(u.core)+'</div>'+
          go+
        '</div></a>';
    });
    g.innerHTML=html;
    setTimeout(function(){ g.querySelectorAll(".road .fill").forEach(function(f){ f.style.width=(f.getAttribute("data-w")||0)+"%"; }); },90);

    /* 総ぼうけんレベル：星のランク */
    var pct=sumT>0?Math.round(sumC/sumT*100):0;
    var tlv=Math.min(20, Math.floor(sumC/4)+1);
    var inLv=sumC%4, toNext=4-inLv, nbar=Math.round(inLv/4*100);
    var crest=document.getElementById("crest");
    crest.className="crest"+(allFull?" allclear":"");
    crest.innerHTML=
      '<div class="orb">'+
        '<div class="ring"><i></i></div>'+
        '<div class="core">'+(allFull
          ?'<span class="lv">MAX</span><span class="lvlab" data-furi>ぜんクリア</span>'
          :'<span class="lv num-f">'+tlv+'</span><span class="lvlab" data-furi>そうレベル</span>')+
        '</div>'+
        (allFull?'<div class="confetti" id="conf"></div>':'')+
      '</div>'+
      '<div class="cap" data-furi>ぼうけんレベル（4きょう ぜんたい）</div>'+
      '<div class="xpbar"><i id="xpfill"></i></div>'+
      '<div class="next" data-furi>'+(allFull?'すべての ワールドを せいは！':'つぎの レベルまで あと '+toNext+' マス（ぜんたい '+pct+'%）')+'</div>';
    crest.querySelectorAll("[data-furi]").forEach(function(el){ el.innerHTML=toRuby(el.innerHTML); });
    setTimeout(function(){ var xf=document.getElementById("xpfill"); if(xf) xf.style.width=(allFull?100:nbar)+"%"; },120);
    if(allFull){
      var conf=document.getElementById("conf"), cols=["#FF6B4A","#4D8BFF","#2BD49B","#FFC24B","#9B7BFF","#FFCB47"];
      for(var i=0;i<18;i++){
        var p=document.createElement("i"), ang=(i/18)*Math.PI*2, dist=66+(i%3)*22;
        p.style.background=cols[i%cols.length];
        p.style.setProperty("--dx",Math.round(Math.cos(ang)*dist)+"px");
        p.style.setProperty("--dy",Math.round(Math.sin(ang)*dist - 18)+"px");
        p.style.animationDelay=(i*0.03)+"s";
        conf.appendChild(p);
      }
    }

    /* 称号棚（ポータル全体のマイルストーン） */
    var BADGES=[
      {got:sumC>=1,   e:"🌱", t:"たんけんの はじまり"},
      {got:allStarted,e:"🧭", t:"4つの ワールドへ"},
      {got:pct>=50,   e:"⭐", t:"はんぶん とうたつ"},
      {got:allFull,   e:"👑", t:"ぜんぶ クリア"}
    ];
    var bh='<span class="blab" data-furi>🏅 称号《しょうごう》：</span>';
    BADGES.forEach(function(b){
      bh+='<span class="badge'+(b.got?' got':'')+'"><span class="be">'+(b.got?b.e:"？")+'</span>'+toRuby(b.t)+'</span>';
    });
    var bd=document.getElementById("badges"); bd.innerHTML=bh;
    bd.querySelectorAll("[data-furi]").forEach(function(el){ el.innerHTML=toRuby(el.innerHTML); });
  })();

  /* 教材リンク */
  var LINKS=[
    {emoji:"📺",ln:"eboard（イーボード）",ld:"動画《どうが》とドリルで 学《まな》べる（無料《むりょう》）",url:"https://www.eboard.jp/"},
    {emoji:"🎬",ln:"NHK for School",ld:"教科《きょうか》の動画《どうが》が たくさん",url:"https://www.nhk.or.jp/school/"},
    {emoji:"🖨️",ln:"プリント",ld:"東京《とうきょう》ベーシック・ドリル（広告《こうこく》なし）",url:"https://www.kyoiku.metro.tokyo.lg.jp/school/study_material/improvement/tokyo_basic_drill/"},
    {emoji:"🔍",ln:"Yahoo!きっず",ld:"安心《あんしん》けんさく・図鑑《ずかん》",url:"https://kids.yahoo.co.jp/"}
  ];
  (function(){
    var g=document.getElementById("grid-links"),html="";
    LINKS.forEach(function(l){
      html+='<a class="linkcard" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+
        '<span class="li">'+l.emoji+'</span>'+
        '<span class="lcol"><span class="ln">'+esc(l.ln)+'</span>'+
        '<span class="ld">'+toRuby(l.ld)+'</span></span>'+
        '<span class="ext">↗</span></a>';
    });
    g.innerHTML=html;
  })();
})();
</script>
<script>
/* ⭐ 星空：ランダムに星をちりばめて、ゆっくりまたたく（reduced-motionでは静止） */
(function(){
  var s=document.getElementById("stars"); if(!s) return;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var n=reduce?40:78, frag=document.createDocumentFragment();
  for(var i=0;i<n;i++){
    var st=document.createElement("i");
    var sz=Math.random()*2+1;
    st.style.width=sz+"px"; st.style.height=sz+"px";
    st.style.left=(Math.random()*100)+"%"; st.style.top=(Math.random()*100)+"%";
    st.style.opacity=(Math.random()*.5+.3).toFixed(2);
    if(!reduce){ st.style.animationDelay=(Math.random()*3.6)+"s"; st.style.animationDuration=(Math.random()*2.5+2.6)+"s"; }
    else { st.style.animation="none"; }
    frag.appendChild(st);
  }
  s.appendChild(frag);
})();
</script>
<script>
/* 🌌 オーロラ：マウスの跡を数珠つなぎのぼかし玉が追いかけ、星雲のしっぽになる。
   - pointermove(マウス/トラックパッド)に追従。touchは無視
   - 3.5秒なにもないと「ひとり旅モード」でゆっくり漂う(タブレットでも生きる)
   - prefers-reduced-motion では起動しない */
(function(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var au=document.getElementById("aurora"); if(!au) return;
  var blobs=[].slice.call(au.children); if(!blobs.length) return;
  var halves=blobs.map(function(b){return b.offsetWidth/2;});
  var pts=blobs.map(function(){return {x:innerWidth/2,y:innerHeight*0.38,o:0};});
  var mx=innerWidth/2,my=innerHeight*0.38,idle=99,t=0,last=performance.now();
  addEventListener("pointermove",function(e){
    if(e.pointerType==="touch") return;
    mx=e.clientX; my=e.clientY; idle=0;
  },{passive:true});
  function frame(now){
    var dt=Math.min((now-last)/1000,.05); last=now; t+=dt; idle+=dt;
    var tx=mx, ty=my;
    if(idle>3.5){ /* ひとり旅 */
      tx=innerWidth *(0.50+0.34*Math.sin(t*0.21));
      ty=innerHeight*(0.40+0.24*Math.cos(t*0.15));
    }
    for(var i=0;i<blobs.length;i++){
      var p=pts[i], g= i===0 ? {x:tx,y:ty} : pts[i-1];
      var k= i===0 ? .20 : .26;
      p.x+=(g.x-p.x)*k; p.y+=(g.y-p.y)*k;
      var oT= idle>3.5 ? .55-(i*.06) : .95-(i*.11);
      p.o+=(oT-p.o)*.045;
      blobs[i].style.transform="translate3d("+(p.x-halves[i])+"px,"+(p.y-halves[i])+"px,0)";
      blobs[i].style.opacity=p.o.toFixed(3);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
