<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深い学び説明問題（書き込みワークシート）— たし算とひき算の筆算 — まなびの基地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1f2a30; --accent:#2F6FB0; --faint:#9aa7ae; --soft:#cdd5d9; --tint:#EAF1F8; }
  *{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body{ margin:0; padding:0; font-family:"M PLUS Rounded 1c",sans-serif; color:var(--ink); background:#eef1f2; }
  ruby rt{ font-size:.5em; font-weight:600; }

  .toolbar{ max-width:210mm; margin:10px auto; text-align:center; }
  .toolbar button{ font:inherit; font-weight:900; cursor:pointer; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:9px 20px; }
  .toolbar span{ color:#667; font-size:12px; margin-left:10px; }

  .page{ position:relative; width:210mm; min-height:297mm; margin:0 auto 12px; padding:8mm 11mm 7mm; background:#fff; display:flex; flex-direction:column; }
  .logo{ position:absolute; top:3mm; right:11mm; font-size:10px; font-weight:800; color:var(--faint); }
  .logo b{ color:var(--accent); }

  /* 記名バンド */
  .band{ display:flex; align-items:center; gap:10px; border:2px solid var(--accent); border-radius:9px; padding:4px 12px; font-weight:800; font-size:12.5px; }
  .band .grade{ white-space:nowrap; }
  .band .nm{ flex:1; display:flex; align-items:center; gap:6px; }
  .band .nm .fill{ flex:1; border-bottom:1.5px solid var(--soft); min-height:16px; }
  .band .date{ white-space:nowrap; border:2px solid var(--ink); border-radius:8px; padding:3px 9px; font-weight:900; font-size:12px; }

  .ttl{ text-align:center; font-size:18px; font-weight:900; margin:4px 0 0; }
  .lead{ text-align:center; font-size:11.5px; font-weight:800; color:var(--accent); margin:0 0 6px; }

  /* 1問＝問題＋四角だけ */
  .q{ flex:1; display:flex; flex-direction:column; margin-bottom:6px; }
  .q:last-child{ margin-bottom:0; }
  .qt{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:900; margin-bottom:4px; }
  .qt .no{ background:var(--accent); color:#fff; border-radius:7px; min-width:24px; height:24px; display:inline-grid; place-items:center; font-size:15px; font-weight:900; flex:none; padding:0 5px; }
  .qt .eq{ color:var(--accent); }
  .box{ flex:1; min-height:38mm; border:2px solid var(--soft); border-radius:10px; background:#fff; }

  @media print{
    html,body{ background:#fff; }
    .toolbar{ display:none; }
    .page{ width:auto; min-height:auto; height:283mm; margin:0; padding:7mm 10mm; }
    @page{ size:A4 portrait; margin:0; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨️ 印刷する（A4・たて）</button>
  <span>※ 四角の中に、ひっ算・図・ことばで せつめいします。</span>
</div>

<div class="page">
  <div class="logo"><ruby>学<rt>まな</rt></ruby>びの<ruby>基地<rt>きち</rt></ruby> <b>⏻</b></div>
  <div class="band">
    <span class="grade">3<ruby>年<rt>ねん</rt></ruby>&nbsp;&nbsp;（&nbsp;&nbsp;）<ruby>組<rt>くみ</rt></ruby>&nbsp;&nbsp;（&nbsp;&nbsp;）<ruby>番<rt>ばん</rt></ruby></span>
    <span class="nm"><ruby>名前<rt>なまえ</rt></ruby><span class="fill"></span></span>
    <span class="date">日づけ&nbsp;&nbsp;月&nbsp;&nbsp;日</span>
  </div>
  <div class="ttl"><ruby>深<rt>ふか</rt></ruby>い<ruby>学<rt>まな</rt></ruby>び<ruby>説明<rt>せつめい</rt></ruby><ruby>問題<rt>もんだい</rt></ruby></div>
  <div class="lead"><ruby>図<rt>ず</rt></ruby>と ことばで「なぜ？」を せつめいしよう</div>

  <div class="q">
    <div class="qt"><span class="no">1</span><span class="eq">３６５＋４５７</span>　なぜ「くり<ruby>上<rt>あ</rt></ruby>がり」が おきるの？</div>
    <div class="box"></div>
  </div>

  <div class="q">
    <div class="qt"><span class="no">2</span><span class="eq">５１２−３４８</span>　なぜ「10を かりる」の？</div>
    <div class="box"></div>
  </div>

  <div class="q">
    <div class="qt"><span class="no">3</span><span class="eq">４０２−１７５</span>　０の くらいは どう かりるの？</div>
    <div class="box"></div>
  </div>

  <div class="q">
    <div class="qt"><span class="no">4</span><span class="eq">２４５６＋３８９７</span>　けたが ふえても、なぜ <ruby>同<rt>おな</rt></ruby>じ やり<ruby>方<rt>かた</rt></ruby>？</div>
    <div class="box"></div>
  </div>

  <div class="q">
    <div class="qt"><span class="no">5</span><span class="eq">１６４＋３４８</span>　なぜ これで「たしかめ」に なるの？</div>
    <div class="box"></div>
  </div>
</div>
</body>
</html>
