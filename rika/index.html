const DRAW_W = 980, DRAW_H = 430;

/* window.storage が無い環境でも落ちない安全ラッパ */
const hasStore = typeof window !== "undefined" && window.storage &&
  typeof window.storage.get === "function";
const store = {
  async get(k) { if (!hasStore) return null; try { return await window.storage.get(k); } catch (e) { return null; } },
  async set(k, v) { if (!hasStore) return; try { await window.storage.set(k, v); } catch (e) {} },
  async del(k) { if (!hasStore) return; try { await window.storage.delete(k); } catch (e) {} },
};

    const el = sceneBoxRef.current;
    if (!el) return;
    const calc = () => {
      const w = el.clientWidth;
      setFit(Math.min(1.3, w / DRAW_W));
    };
    calc();
    let ro;
    if (typeof ResizeObserver !== "undefined") {
      ro = new ResizeObserver(calc);
      ro.observe(el);
    } else {
      window.addEventListener("resize", calc);
    }
    return () => { if (ro) ro.disconnect(); else window.removeEventListener("resize", calc); };
  }, []);

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  探究ミッション（理科版）＝ 算数の計算ゲームを 理科の探究に 置換     ║
   ╚══════════════════════════════════════════════════════════════════╝
   正解時だけ ○表示／まちがいは「もう一回」で 答えは 見えない（自己採点・写し防止）。 */

/* つなげる裏の ∞チャレンジは 理科では未使用（NEXT_CARDS に gen を指定しない）。
   必要になったら ここに キー:コンポーネント を登録して カードに gen:"キー" を付ける。 */
const GENERATORS = {};

const ORDER_COLOR = "#C98A1E";    // 🦋 育ちのじゅんばんクイズ
const INSECT_COLOR = "#3C8C5A";   // 🐛 これはこん虫？
const KANSATSU_COLOR = "#2E91A8"; // 🔍 かんさつ名人ミッション

/* 共通：探究ミッションの 外わく（モーダル） */
function Overlay({ color, gradFrom, icon, sub, title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,30,35,.5)", display: "grid", placeItems: "center", zIndex: 50, padding: 16 }}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(660px, 96vw)", maxHeight: "92vh", overflowY: "auto", background: "#fff", borderRadius: 18, boxShadow: "0 18px 50px rgba(0,0,0,.3)" }}>
        <div style={{ background: `linear-gradient(180deg, ${gradFrom}, ${color})`, color: "#fff", padding: "14px 18px", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", position: "sticky", top: 0, zIndex: 2 }}>
          <span style={{ fontSize: 26 }}>{icon}</span>
          <div style={{ flex: 1, minWidth: 160 }}>
            <div style={{ fontSize: 11, fontWeight: 800, opacity: .92 }}>{sub}</div>
            <div style={{ fontSize: 20, fontWeight: 900 }}>{title}</div>
          </div>
          <button onClick={onClose} style={{ fontSize: 12.5, fontWeight: 900, cursor: "pointer", color: color, background: "#fff", border: "none", borderRadius: 11, padding: "7px 14px" }}>とじる ✕</button>
        </div>
        <div style={{ padding: "16px 18px" }}>{children}</div>
      </div>
    </div>
  );
}

/* ===== 探究①：育ちの じゅんばんクイズ（並べかえ） ===== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function OrderQuiz({ onClose }) {
  const makeOrder = (qi) => {
    const n = LIFE_CYCLES[qi].stages.length;
    let o = shuffle(Array.from({ length: n }, (_, i) => i));
    // たまたま 正解で 始まらないように
    if (o.every((v, i) => v === i)) o = o.reverse();
    return o;
  };
  const [qi, setQi] = useState(() => Math.floor(Math.random() * LIFE_CYCLES.length));
  const [order, setOrder] = useState(() => makeOrder(qi));
  const [checked, setChecked] = useState(false);
  const cyc = LIFE_CYCLES[qi];
  const correct = order.every((v, i) => v === i);

  const newQ = () => { const ni = Math.floor(Math.random() * LIFE_CYCLES.length); setQi(ni); setOrder(makeOrder(ni)); setChecked(false); };
  const move = (pos, dir) => {
    const np = pos + dir;
    if (np < 0 || np >= order.length) return;
    const o = order.slice(); [o[pos], o[np]] = [o[np], o[pos]]; setOrder(o); setChecked(false);
  };

  return (
    <Overlay color={ORDER_COLOR} gradFrom="#E2A93D" icon="🦋" sub="育ちの じゅんを 正しく ならべよう" title="育ちの じゅんばんクイズ" onClose={onClose}>
      <div style={{ background: "#FBF3DF", border: `2px solid ${ORDER_COLOR}`, borderRadius: 12, padding: "11px 14px", marginBottom: 14, fontSize: 13, fontWeight: 700, color: INK, lineHeight: 1.6 }}>
        🎯 <b style={{ color: ORDER_COLOR }}>{cyc.emoji} {cyc.name}</b> の 育ちを、はやい じゅんに ならべよう。<br />カードの ▲▼ で 上下を 入れかえて、「こたえ合わせ」を おそう。
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {order.map((stageIdx, pos) => {
          const ok = checked ? (stageIdx === pos) : null;
          const border = ok === null ? "#e0e8ea" : ok ? GREEN : "#D85A30";
          return (
            <div key={pos} style={{ display: "flex", alignItems: "center", gap: 10, background: "#fff", border: `2px solid ${border}`, borderRadius: 11, padding: "9px 12px" }}>
              <span style={{ width: 26, height: 26, borderRadius: "50%", background: ORDER_COLOR, color: "#fff", fontSize: 13, fontWeight: 900, display: "grid", placeItems: "center", flex: "none" }}>{pos + 1}</span>
              <span style={{ flex: 1, fontSize: 15, fontWeight: 900, color: INK }}>{cyc.stages[stageIdx]}</span>
              {checked && <span style={{ fontSize: 18, fontWeight: 900, color: ok ? GREEN : "#D85A30", flex: "none" }}>{ok ? "○" : "×"}</span>}
              <div style={{ display: "flex", flexDirection: "column", gap: 3, flex: "none" }}>
                <button onClick={() => move(pos, -1)} disabled={pos === 0} style={{ fontSize: 13, fontWeight: 900, cursor: pos === 0 ? "default" : "pointer", opacity: pos === 0 ? .3 : 1, color: "#fff", background: ORDER_COLOR, border: "none", borderRadius: 7, padding: "2px 10px" }}>▲</button>
                <button onClick={() => move(pos, 1)} disabled={pos === order.length - 1} style={{ fontSize: 13, fontWeight: 900, cursor: pos === order.length - 1 ? "default" : "pointer", opacity: pos === order.length - 1 ? .3 : 1, color: "#fff", background: ORDER_COLOR, border: "none", borderRadius: 7, padding: "2px 10px" }}>▼</button>
              </div>
            </div>
          );
        })}
      </div>

      {checked && correct ? (
        <div style={{ marginTop: 14, textAlign: "center", border: `2px solid ${GREEN}`, borderRadius: 14, padding: "14px", background: "#EAF7F1" }}>
          <div style={{ fontSize: 26 }}>🎉</div>
          <div style={{ fontSize: 17, fontWeight: 900, color: GREEN_TX }}>正かい！ じゅんばん 名人！</div>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: SUB, marginTop: 4 }}>{cyc.note}</div>
          <button onClick={newQ} style={{ marginTop: 12, fontSize: 14, fontWeight: 900, cursor: "pointer", color: "#fff", background: ORDER_COLOR, border: "none", borderRadius: 11, padding: "10px 22px" }}>つぎの 生きもの →</button>
        </div>
      ) : (
        <div style={{ marginTop: 14, display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button onClick={() => setChecked(true)} style={{ flex: "1 1 200px", fontSize: 15, fontWeight: 900, cursor: "pointer", color: "#fff", background: ORDER_COLOR, border: "none", borderRadius: 11, padding: "11px 0" }}>こたえ合わせ</button>
          <button onClick={newQ} style={{ flex: "0 0 auto", fontSize: 12.5, fontWeight: 800, cursor: "pointer", color: SUB, background: "#fff", border: "1.5px solid #cdd8dd", borderRadius: 11, padding: "11px 16px" }}>べつの 生きもの</button>
        </div>
      )}
      {checked && !correct && <div style={{ marginTop: 10, fontSize: 12, fontWeight: 800, color: "#D85A30", textAlign: "center" }}>× の ところを ▲▼で 直して、もう一回！（答えは 自分で 考えよう）</div>}
    </Overlay>
  );
}

/* ===== 探究②：これは こん虫？クイズ（なかま分け） ===== */
function InsectQuiz({ onClose }) {
  const pick = () => Math.floor(Math.random() * CREATURES.length);
  const [ci, setCi] = useState(pick);
  const [ans, setAns] = useState(null);   // 子どもが えらんだ true/false
  const [score, setScore] = useState(0);
  const [tries, setTries] = useState(0);
  const c = CREATURES[ci];
  const judged = ans !== null;
  const right = judged && ans === c.insect;

  const choose = (v) => {
    if (judged) return;
    setAns(v); setTries((t) => t + 1);
    if (v === c.insect) setScore((s) => s + 1);
  };
  const next = () => { setCi(pick()); setAns(null); };

  return (
    <Overlay color={INSECT_COLOR} gradFrom="#56B07A" icon="🐛" sub="体の つくりで なかま分け" title="これは こん虫？" onClose={onClose}>
      <div style={{ background: "#EAF6EE", border: `2px solid ${INSECT_COLOR}`, borderRadius: 12, padding: "11px 14px", marginBottom: 14, fontSize: 12.5, fontWeight: 700, color: INK, lineHeight: 1.6 }}>
        🎯 <b style={{ color: INSECT_COLOR }}>こん虫</b>＝体が「頭・むね・はら」の 3つ＆あしが <b>6本</b>（むねから）。あしの数を ヒントに 見分けよう！
      </div>

      <div style={{ textAlign: "center", border: "2px solid #e0e8ea", borderRadius: 14, padding: "16px", background: "#fff" }}>
        <div style={{ fontSize: 64, lineHeight: 1 }}>{c.emoji}</div>
        <div style={{ fontSize: 20, fontWeight: 900, color: INK, marginTop: 6 }}>{c.name}</div>
        <div style={{ fontSize: 12.5, fontWeight: 800, color: SUB, marginTop: 4 }}>あしの数：<b style={{ color: INK }}>{c.legs}本</b></div>
      </div>

      {!judged ? (
        <div style={{ marginTop: 14, display: "flex", gap: 10 }}>
          <button onClick={() => choose(true)} style={{ flex: 1, fontSize: 15, fontWeight: 900, cursor: "pointer", color: "#fff", background: INSECT_COLOR, border: "none", borderRadius: 12, padding: "13px 0" }}>こん虫！</button>
          <button onClick={() => choose(false)} style={{ flex: 1, fontSize: 15, fontWeight: 900, cursor: "pointer", color: INSECT_COLOR, background: "#fff", border: `2px solid ${INSECT_COLOR}`, borderRadius: 12, padding: "13px 0" }}>こん虫じゃない</button>
        </div>
      ) : (
        <div style={{ marginTop: 14, textAlign: "center", border: `2px solid ${right ? GREEN : "#D85A30"}`, borderRadius: 14, padding: "14px", background: right ? "#EAF7F1" : "#FDEEEA" }}>
          <div style={{ fontSize: 22 }}>{right ? "⭕ 正かい！" : "❌ ざんねん"}</div>
          <div style={{ fontSize: 15, fontWeight: 900, color: right ? GREEN_TX : "#B5482C", marginTop: 2 }}>
            {c.name} は {c.insect ? "こん虫" : "こん虫では ない"}
          </div>
          <div style={{ fontSize: 12, fontWeight: 700, color: SUB, marginTop: 6, lineHeight: 1.5 }}>
            {c.insect ? "あし6本・体は 頭・むね・はらの 3つ。" : (c.why || "こん虫の めじるしに 合わない。")}
          </div>
          <button onClick={next} style={{ marginTop: 12, fontSize: 14, fontWeight: 900, cursor: "pointer", color: "#fff", background: INSECT_COLOR, border: "none", borderRadius: 11, padding: "10px 22px" }}>つぎの 生きもの →</button>
        </div>
      )}
      <div style={{ marginTop: 12, fontSize: 12, fontWeight: 800, color: SUB, textAlign: "center" }}>せいせき：{score} / {tries} もん 正かい</div>
    </Overlay>
  );
}

/* ===== 探究③：かんさつ名人ミッション（観点チェック） ===== */
function KansatsuMission({ onClose }) {
  const [ti, setTi] = useState(() => Math.floor(Math.random() * KANSATSU_TARGETS.length));
  const [picked, setPicked] = useState({});
  const t = KANSATSU_TARGETS[ti];
  const count = Object.values(picked).filter(Boolean).length;
  const master = count >= 4;

  const toggle = (p) => setPicked((o) => ({ ...o, [p]: !o[p] }));
  const newT = () => { setTi(Math.floor(Math.random() * KANSATSU_TARGETS.length)); setPicked({}); };

  return (
    <Overlay color={KANSATSU_COLOR} gradFrom="#4DB6C7" icon="🔍" sub="いくつの 見かたで 書けるかな" title="かんさつ名人ミッション" onClose={onClose}>
      <div style={{ background: "#E8F5F8", border: `2px solid ${KANSATSU_COLOR}`, borderRadius: 12, padding: "11px 14px", marginBottom: 14, fontSize: 12.5, fontWeight: 700, color: INK, lineHeight: 1.6 }}>
        🎯 <b style={{ color: KANSATSU_COLOR }}>{t.emoji} {t.name}</b> を かんさつカードに 書こう。書けた <b>見かた</b>に チェックを つけてね。<b>4つ いじょう</b>で かんさつ名人！
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {KANSATSU_POINTS.map((p) => {
          const on = !!picked[p];
          return (
            <button key={p} onClick={() => toggle(p)} style={{ display: "flex", alignItems: "center", gap: 10, textAlign: "left", cursor: "pointer", background: on ? "#E8F5F8" : "#fff", border: `2px solid ${on ? KANSATSU_COLOR : "#e0e8ea"}`, borderRadius: 11, padding: "11px 13px" }}>
              <span style={{ width: 24, height: 24, borderRadius: 7, background: on ? KANSATSU_COLOR : "#fff", border: `2px solid ${on ? KANSATSU_COLOR : "#cdd8dd"}`, color: "#fff", fontSize: 14, fontWeight: 900, display: "grid", placeItems: "center", flex: "none" }}>{on ? "✓" : ""}</span>
              <span style={{ fontSize: 14.5, fontWeight: 800, color: INK }}>{p} を 書いた</span>
            </button>
          );
        })}
      </div>
      <div style={{ marginTop: 14, textAlign: "center", border: `2px solid ${master ? GREEN : "#cdd8dd"}`, borderRadius: 14, padding: "13px", background: master ? "#EAF7F1" : "#f7fafb" }}>
        <div style={{ fontSize: 13, fontWeight: 900, color: master ? GREEN_TX : SUB }}>{master ? "🏆 かんさつ名人！" : `あと ${4 - count} つで 名人`}（いま {count} つ）</div>
        <div style={{ fontSize: 11, fontWeight: 700, color: SUB, marginTop: 5, lineHeight: 1.5 }}>たくさんの 見かたで 書けるほど、くわしい かんさつに なるよ。</div>
        <button onClick={newT} style={{ marginTop: 11, fontSize: 13.5, fontWeight: 900, cursor: "pointer", color: "#fff", background: KANSATSU_COLOR, border: "none", borderRadius: 11, padding: "9px 20px" }}>べつの ものを かんさつ →</button>
      </div>
    </Overlay>
  );
}

function AnsField({ label, unit, value, onChange, ok }) {
  const border = ok === null ? "#cdd8dd" : ok ? GREEN : "#D85A30";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style={{ fontSize: 12.5, fontWeight: 800, color: INK, width: 70, flex: "none" }}>{label}</span>
      <input type="number" value={value} onChange={(e) => onChange(e.target.value)} placeholder="答え"
        style={{ flex: 1, minWidth: 0, fontSize: 17, fontWeight: 900, color: INK, textAlign: "right", border: `2px solid ${border}`, borderRadius: 9, padding: "6px 9px", outline: "none" }} />
      <span style={{ fontSize: 13, fontWeight: 900, flex: "none" }}>{unit}</span>
      {ok !== null && <span style={{ fontSize: 17, fontWeight: 900, color: ok ? GREEN : "#D85A30", width: 18, flex: "none" }}>{ok ? "○" : "×"}</span>}
    </div>
  );
}
function Row({ label, value, color, big }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: big ? "3px 0" : "2px 0" }}>
      <span style={{ fontSize: big ? 12.5 : 11, fontWeight: 800, color: color }}>{label}</span>
      <span style={{ fontSize: big ? 19 : 13, fontWeight: 900, color: color }}>{value}</span>
    </div>
  );
}

/* 「つまずきレスキュー隊」カードの色（旧ミニ授業ボード由来の名残） */
const MINI_COLOR = "#E8731C";


/* ===== 小物 ===== */
function LinkChip({ item, block }) {
  const base = { fontSize: 11, fontWeight: 800, borderRadius: 11, padding: "5px 11px", textDecoration: "none", display: block ? "block" : "inline-block" };
  const has = item && item.url;
  if (has) {
    return <a href={item.url} target="_blank" rel="noreferrer" style={{ ...base, color: "#fff", background: GREEN, border: `1.5px solid ${GREEN}` }}>{item.t} ↗</a>;
  }
  return <span style={{ ...base, color: SUB, border: "1.5px dashed #cdd8dd", background: "#fff" }}>{item.t}</span>;
}
function SectionTitle({ color, icon, text, mt }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, fontWeight: 900, color, margin: mt ? "12px 0 6px" : "0 0 6px" }}><span>{icon}</span>{text}</div>;
}
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
