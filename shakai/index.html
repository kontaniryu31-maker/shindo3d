const GRAY = "#8a8d99";

/* ===== 整理デザイン用：構造・常設のクロムは「落ち着いた藍」に寄せる（A案）=====

const darken = (hex, amt) => { const n = parseInt(hex.slice(1), 16); const r = Math.round(((n >> 16) & 255) * (1 - amt)), g = Math.round(((n >> 8) & 255) * (1 - amt)), b = Math.round((n & 255) * (1 - amt)); return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); };

  ["茶畑","ちゃばたけ"], ["果樹園","かじゅえん"], ["工場","こうじょう"], ["農家","のうか"],
  /* 地名・固有名 */
  ["奈良市","ならし"], ["奈良県","ならけん"], ["奈良","なら"], ["月ヶ瀬","つきがせ"], ["都祁","つげ"],

// 「上」は じょう（教科書 上）／うえ で読みが割れるため 個別に処理。

const chromeFuri = (s) => String(s == null ? "" : s)

  .replace(/すんでいる市/g, "すんでいる{市|し}").replace(/の市/g, "の{市|し}");
let _rbKey = 0;
function rb(input) {
  if (input == null) return input;
  let text = String(input);
  const slots = [];
  const ph = (k, y) => { slots.push([k, y]); return "‹‹" + (slots.length - 1) + "‹‹"; };
  text = text.replace(/\{([^|{}]+)\|([^|{}]+)\}/g, (m, k, y) => ph(k, y));
  const dict = [...FURI_DICT].sort((a, b) => b[0].length - a[0].length);
  for (const [k, y] of dict) { if (text.indexOf(k) >= 0) text = text.split(k).join(ph(k, y)); }
  return text.split(/(‹‹\d+‹‹)/).map((p, i) => {
    const m = /^‹‹(\d+)‹‹$/.exec(p);
    if (m) { const [k, y] = slots[+m[1]]; return <ruby key={"r" + i + "_" + (_rbKey++)}>{k}<rt>{y}</rt></ruby>; }
    return p;
  });
}

/* ===== 立体（アイソメ） ===== */
const CW = 134, CH = 60, GX = 4, HEADER = 76, DEEP = 120;
const N = STAGES.length;
const FW = N * CW + (N - 1) * GX;
const FH = HEADER + DEPTH.length * CH;
const ZX = 0.62, ZY = -0.45;
const px = (x, y, z) => ({ left: x + z * ZX, top: y + z * ZY });
const OX = 180, OY = 116;
// 実際の描画域（左の深度ラベル px(-150) 〜 右の奥行き/ラベルまで）。これで縮小率を計算する
// 中身の実寸（横≒30〜940 / 縦≒40〜402）に合わせて余白を切り詰め、箱を大きく見せる
const DRAW_W = 1000, DRAW_H = 492;
const wrap = (p) => ({ left: OX + p.left, top: OY + p.top });

const STORE_KEY = "shindo3d_shakai_nara_v1"; // ★単元ごとに変える（別単元へ流用時は名前を変えて 保存の混在を防ぐ）

/* window.storage が無い環境でも落ちない安全ラッパ */
const hasStore = typeof window !== "undefined" && window.storage &&
  typeof window.storage.get === "function";
const store = {
  async get(k) { if (!hasStore) return null; try { return await window.storage.get(k); } catch (e) { return null; } },
  async set(k, v) { if (!hasStore) return; try { await window.storage.set(k, v); } catch (e) {} },
  async del(k) { if (!hasStore) return; try { await window.storage.delete(k); } catch (e) {} },
};

function App() {
  const [openStage, setOpenStage] = useState(1);
  const [openLv, setOpenLv] = useState(0);       // どのマスを開いているか（既定はLv1「読む」＝学習の入口）
  const [done, setDone] = useState({});           // "s-k": true（ぬったマス）
  const [showBack, setShowBack] = useState(false); // つなげる裏面
  const [activeCard, setActiveCard] = useState("hatraku"); // つなげる先カード
  const [showPBL, setShowPBL] = useState(false);   // PBL画面（お買いもの）
  const [showBattle, setShowBattle] = useState(false); // PBL（モンスターバトル）
  const [showCipher, setShowCipher] = useState(false); // PBL（奈良市たんけん）
  const [showMap, setShowMap] = useState(false);   // PBL（絵地図の読み取り）
  const [showPlayMenu, setShowPlayMenu] = useState(false); // 🎮 あそんで まなぶ（4つのPBLを束ねるメニュー）
  const [showTest, setShowTest] = useState(false); // たしかめテスト（まとめ）
  const [budget, setBudget] = useState(5000);       // 予算（自分で設定）
  const [cart, setCart] = useState({});             // {itemId: 個数}
  const [loaded, setLoaded] = useState(false);

  // 立体シーンをコンテナ幅に合わせて自動縮小（はみ出し防止）
  const sceneBoxRef = useRef(null);
  const guideRef = useRef(null);
  // マスを選んだら 下の「やること」ガイドへ スッと スクロール
  const goGuide = (st, lv) => {
    setOpenStage(st); setOpenLv(lv);
    setTimeout(() => { try { guideRef.current && guideRef.current.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {} }, 90);
  };
  const [fit, setFit] = useState(1);
  useEffect(() => {
    const el = sceneBoxRef.current;
    if (!el) return;
    const calc = () => {
      const w = el.clientWidth;
      setFit(Math.min(1.3, w / DRAW_W));
    };
    calc();
    let ro;
    if (typeof ResizeObserver !== "undefined") {
      ro = new ResizeObserver(calc);
      ro.observe(el);
    } else {
      window.addEventListener("resize", calc);
    }
    return () => { if (ro) ro.disconnect(); else window.removeEventListener("resize", calc); };
  }, []);

  /* ===== 永続保存：読み込み ===== */
  useEffect(() => {
    let alive = true;
    (async () => {
      const r = await store.get(STORE_KEY);
      if (alive && r && r.value) {
        try {
          const v = JSON.parse(r.value);
          setDone(v.done || {});
        } catch (e) { /* 壊れていたら無視 */ }
      }
      if (alive) setLoaded(true);
    })();
    return () => { alive = false; };
  }, []);
  /* ===== 永続保存：書き込み ===== */
  useEffect(() => {
    if (!loaded) return;
    store.set(STORE_KEY, JSON.stringify({ done }));
  }, [done, loaded]);

  const toggleDone = (s, k) => setDone((d) => ({ ...d, [`${s}-${k}`]: !d[`${s}-${k}`] }));
  const resetAll = async () => {
    setDone({});
    await store.del(STORE_KEY);
  };

     全部doneなら allClear。 */
  let nextStage = null, nextLv = null;
  for (let i = 0; i < STAGES.length && nextStage == null; i++) {
    const s = STAGES[i].n;
    for (let k = 0; k < DEPTH.length; k++) {
      if (!done[`${s}-${k}`]) { nextStage = s; nextLv = k; break; }
    }
  }
  const allClear = nextStage == null;
  const nextStageObj = allClear ? null : STAGES.find((s) => s.n === nextStage);
  // 「はじめる →」＝セルのonClick（goGuide）と同じ状態更新を再現
  const startNext = () => {
    if (allClear) return;
    setShowBack(false);
    setShowPlayMenu(false);
    goGuide(nextStage, nextLv);
  };

  // 箱頂点
  const A = px(-20, -20, 0), B = px(FW + 20, -20, 0), Cc = px(FW + 20, FH + 20, 0), D = px(-20, FH + 20, 0);
  const A2 = px(-20, -20, DEEP), B2 = px(FW + 20, -20, DEEP), C2 = px(FW + 20, FH + 20, DEEP), D2 = px(-20, FH + 20, DEEP);

  return (
    <div style={{
      fontFamily: "'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif",
      background: THEME.bg,
      minHeight: "100vh", color: INK, padding: "16px 18px 26px", boxSizing: "border-box",
    }}>
      <style>{`@keyframes popUp{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cellPop{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}`}</style>
      {/* ヘッダー */}
      <div style={{ display: "flex", alignItems: "center", gap: 13, flexWrap: "wrap" }}>
        {/* 電源マークロゴ（任天堂風・白縁＋赤ハロー＋8突起スパークル） */}
        <div style={{ width: 50, height: 50, borderRadius: 14, background: PRIMARY, color: "#fff", display: "grid", placeItems: "center", flex: "none", boxShadow: "0 0 0 4px #fff,0 0 0 6px rgba(255,78,58,.25)" }}>
          <svg viewBox="0 0 24 24" fill="#fff" width="28" height="28">
            <polygon points="12,1.5 14.2,9.8 22.5,12 14.2,14.2 12,22.5 9.8,14.2 1.5,12 9.8,9.8" />
          </svg>
        </div>
        <div style={{ flex: 1, minWidth: 240 }}>
          <div style={{ fontSize: 22, fontWeight: 900, color: SPACE_INK, lineHeight: 1.05 }}>3D 自由進度表</div>
          <div style={{ fontSize: 12.5, fontWeight: 800, marginTop: 2, color: SPACE_SUB }}>たんげん：<span style={{ color: SPACE_GOLD }}>{rb(chromeFuri(UNIT))}</span></div>
          <div style={{ fontSize: 11.5, fontWeight: 700, color: SPACE_SUB, marginTop: 2, lineHeight: 1.7 }}>{rb(dataFuri(BOOK))}　／　{rb("いちばん大事")}：{rb(chromeFuri(CORE))}</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: SPACE_SUB, textAlign: "right", lineHeight: 1.5 }}>
            <span style={{ color: INDIGO }}>━</span>{rb("すすむ")}　<span style={{ color: INDIGO }}>━</span>{rb("ふかめる")}（{rb("わかりの ふかさ")}）　<span style={{ color: "#5BD9AD" }}>━</span>{rb("つなげる")}

/* ===== 共通：シャッフル ===== */
function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
const randInt = (n) => Math.floor(Math.random() * n);

/* ===== 問題メーカー（{display, choices, ansIndex, explain} を返す） ===== */
/* 地図記号：由来の せつめい → 記号の名前を 4択で あてる */
/* ===== 本物の地図（国土地理院 地理院地図）コンポーネント ===== */
function RealMap({ center, zoom = 13, markers = [], height = 290 }) {
  const elRef = useRef(null);
  // 問題が変わったら（マーカーが変われば）地図を作り直す。同じ問題内の再描画では作り直さない。
  const sig = JSON.stringify({ c: center, z: zoom, m: markers.map((m) => [m.lat, m.lng, m.label, m.color]) });
  useEffect(() => {
    if (!elRef.current || typeof L === "undefined") return;
    const map = L.map(elRef.current, { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "出典：<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank' rel='noopener'>国土地理院</a>",
    }).addTo(map);
    const pts = [];
    markers.forEach((m) => {
      const bg = m.color || "#A55B2C";
      const icon = L.divIcon({
        className: "",
        html: `<div style="transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;"><div style="background:${bg};color:#fff;font-size:12px;font-weight:900;white-space:nowrap;padding:3px 9px;border-radius:11px;box-shadow:0 1px 5px rgba(0,0,0,.35);border:2px solid #fff;">${m.label || ""}</div><div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid ${bg};"></div></div>`,
        iconSize: [0, 0], iconAnchor: [0, 0],
      });
      L.marker([m.lat, m.lng], { icon }).addTo(map);
      pts.push([m.lat, m.lng]);
    });
    if (pts.length > 1) map.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
    else map.setView(center || pts[0] || [34.685, 135.82], zoom);
    setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 60);
    return () => { try { map.remove(); } catch (e) {} };
  }, [sig]);
  return <div ref={elRef} style={{ width: "100%", height, borderRadius: 12, overflow: "hidden", border: "2px solid #cdd8dd", zIndex: 0 }} />;
}

/* 本物の地図：北緯・東経から「2地点の方位（北上・主軸）」を計算 */
function houiOf(a, b) {
  const x = (b.lng - a.lng) * Math.cos(34.7 * Math.PI / 180), y = b.lat - a.lat;
  return Math.abs(x) >= Math.abs(y) ? (x > 0 ? "東" : "西") : (y > 0 ? "北" : "南");
}
function makeHouiMapQ() {
  const clear = (a, b) => { const x = (b.lng - a.lng) * Math.cos(34.7 * Math.PI / 180), y = b.lat - a.lat; return Math.abs(Math.abs(x) - Math.abs(y)) > 0.004; };
  let a, b, t = 0;
  do { a = NARA_PLACES[randInt(NARA_PLACES.length)]; b = NARA_PLACES[randInt(NARA_PLACES.length)]; t++; } while (t < 80 && (a === b || !clear(a, b)));
  const ans = houiOf(a, b);
  const opts = shuffle(["東", "西", "南", "北"]);
  return {
    scene: <RealMap height={300} markers={[
      { lat: a.lat, lng: a.lng, label: `${a.emoji}${a.name}`, color: "#2E7D32" },
      { lat: b.lat, lng: b.lng, label: `${b.emoji}${b.name}`, color: "#C0392B" },
    ]} />,
    display: `本物の 地図で、${a.emoji}${a.name}から 見て ${b.emoji}${b.name}は どの方位？（地図は 北が 上）`,
    choices: opts, ansIndex: opts.indexOf(ans),
    explain: `${a.name}から 見て ${b.name}は「${ans}」がわ。本物の地図でも 北が上だよ。`,
  };
}

/* 本物の地図：「Cの〇方位にあるのは どれ？」（位置の読み取り） */
function makeMapReadQ() {
  for (let t = 0; t < 80; t++) {
    const sh = shuffle(NARA_PLACES);
    const C = sh[0], cand = [sh[1], sh[2], sh[3]];
    const hs = cand.map((p) => houiOf(C, p));
    for (const dir of shuffle(["東", "西", "南", "北"])) {
      const idx = hs.map((h, i) => (h === dir ? i : -1)).filter((i) => i >= 0);
      if (idx.length === 1) {
        const ans = cand[idx[0]];
        const opts = shuffle(cand);
        return {
          scene: <RealMap height={300} markers={[
            { lat: C.lat, lng: C.lng, label: `★${C.emoji}${C.name}`, color: "#2E7D32" },
            ...cand.map((p) => ({ lat: p.lat, lng: p.lng, label: `${p.emoji}${p.name}`, color: "#C0392B" })),
          ]} />,
          display: `本物の 地図で、★${C.emoji}${C.name}から 見て「${dir}」がわに あるのは どれ？`,
          choices: opts.map((p) => `${p.emoji}${p.name}`),
          ansIndex: opts.indexOf(ans),
          explain: `${C.name}から 見て「${dir}」がわは ${ans.name}。地図は 北が上、右が東だよ。`,
        };
      }
    }
  }
  return makeHouiMapQ();
}

/* ===== 本物の地図記号（国土地理院の標準記号を SVG で描く） ===== */
function symbolSvg(name, size = 78) {
  const ink = INK, sw = 7;
  const L = (x1, y1, x2, y2, w) => <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={ink} strokeWidth={w || sw} strokeLinecap="round" />;
  let inner;
  if (name.includes("学校")) inner = <text x="50" y="76" fontSize="80" fontWeight="900" textAnchor="middle" fill={ink} fontFamily="serif">文</text>;
  else if (name.includes("図書")) inner = <g fill="none" stroke={ink} strokeWidth="5" strokeLinejoin="round"><path d="M50 34 C40 28 24 28 16 34 L16 72 C24 66 40 66 50 72 C60 66 76 66 84 72 L84 34 C76 28 60 28 50 34 Z" /><line x1="50" y1="34" x2="50" y2="72" stroke={ink} strokeWidth="5" /></g>;
  else if (name.includes("寺")) inner = <text x="50" y="75" fontSize="78" fontWeight="900" textAnchor="middle" fill={ink} fontFamily="serif">卍</text>;
  else if (name.includes("神社")) inner = <g>{L(16, 30, 84, 30, 9)}{L(26, 46, 74, 46, 7)}{L(34, 30, 34, 84)}{L(66, 30, 66, 84)}</g>;
  else if (name.includes("ゆうびん") || name.includes("郵便")) inner = <g><circle cx="50" cy="50" r="40" fill="none" stroke={ink} strokeWidth="6" /><text x="50" y="67" fontSize="48" fontWeight="900" textAnchor="middle" fill={ink}>〒</text></g>;
  else if (name.includes("病院")) inner = <g>{L(50, 20, 50, 80, 15)}{L(20, 50, 80, 50, 15)}</g>;
  else if (name.includes("けいさつ") || name.includes("警察")) inner = <g><circle cx="50" cy="50" r="38" fill="none" stroke={ink} strokeWidth="6" />{L(33, 33, 67, 67, 8)}{L(67, 33, 33, 67, 8)}</g>;
  else if (name.includes("消防")) inner = <g fill="none" stroke={ink} strokeWidth="7" strokeLinecap="round"><path d="M28 54 L28 40 A22 22 0 0 1 72 40 L72 54" />{L(50, 50, 50, 84, 7)}</g>;
  else if (name.includes("工場")) inner = <g>{[0, 45, 90, 135, 180, 225, 270, 315].map((d, k) => { const r = Math.PI * d / 180, x1 = 50 + 24 * Math.cos(r), y1 = 50 + 24 * Math.sin(r), x2 = 50 + 38 * Math.cos(r), y2 = 50 + 38 * Math.sin(r); return <line key={k} x1={x1} y1={y1} x2={x2} y2={y2} stroke={ink} strokeWidth="9" strokeLinecap="round" />; })}<circle cx="50" cy="50" r="20" fill="none" stroke={ink} strokeWidth="6" /><circle cx="50" cy="50" r="7" fill={ink} /></g>;
  else if (name.includes("市役所")) inner = <g><circle cx="50" cy="50" r="38" fill="none" stroke={ink} strokeWidth="6" /><circle cx="50" cy="50" r="13" fill={ink} /></g>;
  else if (name === "田") inner = <g>{L(40, 28, 40, 72, 9)}{L(60, 28, 60, 72, 9)}</g>;
  else if (name === "畑") inner = <g>{[38, 62].map((x, k) => <g key={k}>{L(x, 72, x, 46, 6)}{L(x, 48, x - 9, 38, 6)}{L(x, 48, x + 9, 38, 6)}</g>)}</g>;
  else if (name.includes("かじゅ") || name.includes("果樹")) inner = <g><circle cx="50" cy="56" r="24" fill="none" stroke={ink} strokeWidth="7" />{L(50, 32, 58, 22, 5)}</g>;
  else if (name.includes("老人")) inner = <g fill="none" stroke={ink} strokeWidth="6" strokeLinejoin="round"><path d="M22 52 L50 28 L78 52" /><rect x="30" y="52" width="40" height="30" /><path d="M48 60 q10 0 10 9 L58 76" strokeWidth="5" /></g>;
  else inner = <text x="50" y="64" fontSize="30" textAnchor="middle" fill={ink}>?</text>;
  return <svg width={size} height={size} viewBox="0 0 100 100" style={{ background: "#fff", border: "2px solid #cdd8dd", borderRadius: 12 }}>{inner}</svg>;
}

function makeSymbolQ() {
  const i = randInt(MAP_SYMBOLS.length);
  const ans = MAP_SYMBOLS[i];
  const others = shuffle(MAP_SYMBOLS.filter((_, k) => k !== i)).slice(0, 3);
  const opts = shuffle([ans, ...others]);
  return {
    scene: <div style={{ display: "flex", justifyContent: "center" }}>{symbolSvg(ans.name, 88)}</div>,
    display: `この 本物の 地図記号は 何を 表している？`,
    choices: opts.map((o) => o.name),
    ansIndex: opts.indexOf(ans),
    explain: `${ans.name}　…${ans.yurai}`,
  };
}

/* 方位：はんたいの方位／地図の向き／地いきの方位 */
const DIRS = ["北", "東", "南", "西"];
const OPP = { 北: "南", 南: "北", 東: "西", 西: "東" };
function makeHouiQ() {
  const t = randInt(3);
  if (t === 0) {
    const d = DIRS[randInt(4)];
    const ans = OPP[d];
    const opts = shuffle(DIRS);
    return { display: `「${d}」の はんたいの 方位は？`, choices: opts, ansIndex: opts.indexOf(ans), explain: `${d}の はんたいは「${ans}」。北⇔南、東⇔西。` };
  }
  if (t === 1) {
    const map = [["右", "東"], ["左", "西"], ["上", "北"], ["下", "南"]];
    const m = map[randInt(map.length)];
    const opts = shuffle(DIRS);
    return { display: `地図は『北を 上』に します。地図の「${m[0]}」は どの方位？`, choices: opts, ansIndex: opts.indexOf(m[1]), explain: `北を上に すると、上＝北・下＝南・右＝東・左＝西。だから「${m[0]}」は「${m[1]}」。` };
  }
  const simple = NARA_AREAS.filter((a) => DIRS.indexOf(a.houi) >= 0);
  const a = simple[randInt(simple.length)];
  const opts = shuffle(DIRS);
  return { display: `奈良市の 中心から見て、「${a.name}」は どの方位？`, choices: opts, ansIndex: opts.indexOf(a.houi), explain: `${a.name}は 奈良市の「${a.houi}」がわ。` };
}

/* 地いき：土地のようす（または しごと）→ どの地いきか あてる */
function makeChiikiQ() {
  const i = randInt(NARA_AREAS.length);
  const ans = NARA_AREAS[i];
  const others = shuffle(NARA_AREAS.filter((_, k) => k !== i)).slice(0, 3);
  const opts = shuffle([ans, ...others]);
  const useJob = Math.random() < 0.4;
  const clue = useJob ? `さかんな しごと：${ans.job}` : ans.feature;
  return {
    display: `つぎの ようすの 地いきは どこ？\n「${clue}」`,
    choices: opts.map((o) => o.name),

    explain: `${ans.name}（奈良市の ${ans.houi}）`,
  };
}

/* 本物の地図：奈良市の5つの地いきを 地理院地図で 読み取る */
function makeChiikiMapQ() {
  const areas = NARA_AREAS;
  if (Math.random() < 0.5) {
    // 方位タイプ：中心から見て その地いきは どの方位？
    const center = areas[0];
    const cand = areas.filter((a) => a !== center);
    const ans = cand[randInt(cand.length)];

    return {
      scene: <RealMap height={300} markers={[
        { lat: center.lat, lng: center.lng, label: `★${center.name}`, color: "#2E7D32" },

  }
  // ようすタイプ：地図に5地いきを置き、土地のようすから あてる
  const i = randInt(areas.length);
  const ans = areas[i];
  const others = shuffle(areas.filter((_, k) => k !== i)).slice(0, 3);

    display: `本物の 地図で 5つの 地いきの 場所を たしかめて、つぎの ようすは どの 地いき？\n「${clue}」`,
    choices: opts.map((o) => o.name),
    ansIndex: opts.indexOf(ans),
    explain: `${ans.name}（奈良市の ${ans.houi}）…${clue}`,
  };
}

/* ===== 資料読み取り：方位じしん（コンパス）を 読む ===== */
const DIR8 = ["北", "北東", "東", "南東", "南", "南西", "西", "北西"];
const DIR_VEC = { "北": [0, -1], "北東": [0.7, -0.7], "東": [1, 0], "南東": [0.7, 0.7], "南": [0, 1], "南西": [-0.7, 0.7], "西": [-1, 0], "北西": [-0.7, -0.7] };
function CompassSVG({ dir }) {
  const c = 80, R = 60;
  const v = DIR_VEC[dir];
  const tip = [c + v[0] * (R - 14), c + v[1] * (R - 14)];
  const tail = [c - v[0] * (R - 26), c - v[1] * (R - 26)];
  const perp = [-v[1] * 7, v[0] * 7];
  const redTri = `${tip[0]},${tip[1]} ${c + perp[0]},${c + perp[1]} ${c - perp[0]},${c - perp[1]}`;
  const grayTri = `${tail[0]},${tail[1]} ${c + perp[0]},${c + perp[1]} ${c - perp[0]},${c - perp[1]}`;
  const labels = [["北", 0, -1], ["東", 1, 0], ["南", 0, 1], ["西", -1, 0]];
  return (
    <svg width="160" height="160" viewBox="0 0 160 160" style={{ background: "#fff", borderRadius: 12, border: "2px solid #cdd8dd" }}>
      <circle cx={c} cy={c} r={R} fill="#F8FBFC" stroke="#9fb6bd" strokeWidth="2" />
      <circle cx={c} cy={c} r="3" fill="#5b6a72" />
      {labels.map(([t, dx, dy], i) => (
        <text key={i} x={c + dx * (R + 0)} y={c + dy * (R + 0) + 5} fontSize="15" fontWeight="900" textAnchor="middle" fill={t === "北" ? "#D14B3D" : "#2A3B40"}>{t}</text>
      ))}
      <polygon points={grayTri} fill="#8a97a0" />
      <polygon points={redTri} fill="#D14B3D" />
    </svg>
  );
}
function makeCompassQ() {
  const eight = Math.random() < 0.45;
  const pool = eight ? DIR8 : ["北", "東", "南", "西"];
  const ans = pool[randInt(pool.length)];
  let opts;
  if (eight) { const others = shuffle(DIR8.filter((d) => d !== ans)).slice(0, 3); opts = shuffle([ans, ...others]); }
  else { opts = shuffle(["北", "東", "南", "西"]); }
  return {
    scene: <CompassSVG dir={ans} />,
    display: "方位じしんの 赤い はりが さしている 方位は？",
    choices: opts, ansIndex: opts.indexOf(ans),
    explain: `赤い はりの 先が「${ans}」だよ。（北を 上に して 読もう）`,
  };
}

/* ===== 資料読み取り：絵地図（線路・地図記号）を 読む ===== */
const MAP_FEATURES = [
  { g: "🏫", name: "学校" }, { g: "⛩", name: "神社" }, { g: "卍", name: "寺" },
  { g: "🏥", name: "病院" }, { g: "🏪", name: "店" }, { g: "🌾", name: "田" },
  { g: "🏭", name: "工場" }, { g: "〒", name: "ゆうびん局" }, { g: "🚓", name: "交番" },
];
function MapSVG({ items, rail }) {
  const ox = 34, oy = 28, cell = 46, NC = 4;
  const cx = (col) => ox + col * cell + cell / 2;
  const cy = (row) => oy + row * cell + cell / 2;
  const ties = [];
  if (rail.horiz) { for (let k = 0; k < 8; k++) { const x = ox + 6 + k * (NC * cell - 12) / 7; ties.push(<line key={k} x1={x} y1={cy(rail.idx) - 7} x2={x} y2={cy(rail.idx) + 7} stroke="#9aa7ad" strokeWidth="2" />); } }
  else { for (let k = 0; k < 8; k++) { const y = oy + 6 + k * (NC * cell - 12) / 7; ties.push(<line key={k} x1={cx(rail.idx) - 7} y1={y} x2={cx(rail.idx) + 7} y2={y} stroke="#9aa7ad" strokeWidth="2" />); } }
  return (
    <svg width="244" height="234" viewBox="0 0 244 234" style={{ background: "#FBFEFE", borderRadius: 12, border: "2px solid #cdd8dd" }}>
      {/* グリッド */}
      {[0, 1, 2, 3, 4].map((i) => (<g key={"g" + i}>
        <line x1={ox} y1={oy + i * cell} x2={ox + NC * cell} y2={oy + i * cell} stroke="#e1e8ea" strokeWidth="1" />
        <line x1={ox + i * cell} y1={oy} x2={ox + i * cell} y2={oy + NC * cell} stroke="#e1e8ea" strokeWidth="1" />
      </g>))}
      {/* 線路 */}
      {rail.horiz
        ? <line x1={ox} y1={cy(rail.idx)} x2={ox + NC * cell} y2={cy(rail.idx)} stroke="#5b6a72" strokeWidth="3" />
        : <line x1={cx(rail.idx)} y1={oy} x2={cx(rail.idx)} y2={oy + NC * cell} stroke="#5b6a72" strokeWidth="3" />}
      {ties}
      {/* 駅 */}
      <text x={cx(rail.st.col)} y={cy(rail.st.row) + 8} fontSize="24" textAnchor="middle">🚉</text>
      {/* 地図記号・たてもの */}
      {items.map((it, i) => (
        <text key={i} x={cx(it.col)} y={cy(it.row) + 8} fontSize={it.g.length === 1 && it.g.charCodeAt(0) < 0x3000 ? 18 : 22} fontWeight="900" textAnchor="middle" fill="#2A3B40">{it.g}</text>
      ))}
      {/* 方位記号（北が上） */}
      <g>
        <circle cx="222" cy="30" r="17" fill="#fff" stroke="#2E91A8" strokeWidth="1.5" />
        <polygon points="222,16 218,30 226,30" fill="#D14B3D" />
        <polygon points="222,44 218,30 226,30" fill="#8a97a0" />
        <text x="222" y="13" fontSize="9" fontWeight="900" textAnchor="middle" fill="#D14B3D">北</text>
        <text x="222" y="55" fontSize="8" fontWeight="800" textAnchor="middle" fill="#5b6a72">南</text>
        <text x="206" y="33" fontSize="8" fontWeight="800" textAnchor="middle" fill="#5b6a72">西</text>
        <text x="238" y="33" fontSize="8" fontWeight="800" textAnchor="middle" fill="#5b6a72">東</text>
      </g>
    </svg>
  );
}
function makeMapQ() {
  // 線路（縦 or 横）と 駅
  const horiz = Math.random() < 0.5;
  const idx = 1 + randInt(2); // 内側の行/列（1 or 2）
  const stPos = randInt(4);
  const rail = { horiz, idx, st: horiz ? { row: idx, col: stPos } : { row: stPos, col: idx } };
  // たてもの・記号を 重ならない別マスに 3つ
  const used = new Set([`${rail.st.row},${rail.st.col}`]);
  const feats = shuffle(MAP_FEATURES).slice(0, 3).map((f) => {
    let row, col, key;
    do { row = randInt(4); col = randInt(4); key = `${row},${col}`; } while (used.has(key));
    used.add(key); return { ...f, row, col };
  });
  const all = [...feats, { g: "🚉", name: "駅", row: rail.st.row, col: rail.st.col }];
  // A→B の方位（はっきり片方向に なる組を えらぶ）
  let A, B, dx, dy, ans, tries = 0;
  do {
    A = all[randInt(all.length)]; B = all[randInt(all.length)];
    dx = B.col - A.col; dy = B.row - A.row; tries++;
  } while (tries < 40 && (A === B || Math.abs(dx) === Math.abs(dy)));
  ans = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? "東" : "西") : (dy > 0 ? "南" : "北");
  const opts = shuffle(["東", "西", "南", "北"]);
  return {
    scene: <MapSVG items={feats} rail={rail} />,
    display: `この 地図で、${A.name}から 見て ${B.name}は どの方位？`,
    choices: opts, ansIndex: opts.indexOf(ans),
    explain: `${A.name}から見て ${B.name}は「${ans}」がわ。地図は 北が上だよ。`,
  };
}

/* ミックス：方位（ことば＋方位じしん） */
function makeHouiMix() { const r = randInt(3); return r === 0 ? makeHouiMapQ() : r === 1 ? makeHouiQ() : makeCompassQ(); }
/* ミックス：学校のまわり（絵地図の読み取り＋地図記号＋方位） */
function makeMapMix() { const r = randInt(3); return r === 0 ? makeMapReadQ() : r === 1 ? makeSymbolQ() : makeHouiMapQ(); }
/* ミックス：この単元 まるごと（方位・記号・地いき・絵地図・方位じしん） */
function makeMixAll() { const r = randInt(5); return r === 0 ? makeHouiMapQ() : r === 1 ? makeSymbolQ() : r === 2 ? makeChiikiMapQ() : r === 3 ? makeMapReadQ() : makeCompassQ(); }

/* ===== 無限：選択式クイズ（つなげる裏面の ∞チャレンジ用） ===== */
function InfiniteChoiceQuiz({ make, hint }) {
  const [q, setQ] = useState(make);
  const [picked, setPicked] = useState(null);
  const [streak, setStreak] = useState(0);
  const [count, setCount] = useState(0);
  const choose = (k) => {
    if (picked !== null) return;
    setPicked(k);
    setCount((c) => c + 1);
    setStreak((s) => (k === q.ansIndex ? s + 1 : 0));
  };
  const next = () => { setQ(make()); setPicked(null); };
  const isOK = picked !== null && picked === q.ansIndex;
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, fontWeight: 800, color: SUB, marginBottom: 8 }}>
        <span>れんぞく正かい：<b style={{ color: GREEN_TX }}>{streak}</b></span>
        <span>といた数：{count}</span>
      </div>
      <div style={{ background: "#F3EDFB", border: `2px solid ${AMBER_MAIN}`, borderRadius: 12, padding: "14px 13px" }}>
        {q.scene && <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}>{q.scene}</div>}
        <div style={{ fontSize: 15, fontWeight: 900, color: INK, lineHeight: 1.5, whiteSpace: "pre-line", textAlign: "center" }}>{q.display}</div>
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 7 }}>
          {q.choices.map((c, k) => {
            const chosen = picked === k;
            const correct = picked !== null && k === q.ansIndex;
            const bg = correct ? "#E7F6EF" : chosen ? "#FCE9E2" : "#fff";
            const bd = correct ? GREEN : chosen ? "#D85A30" : "#cdd8dd";
            return (
              <button key={k} onClick={() => choose(k)} disabled={picked !== null} style={{
                fontSize: 14.5, fontWeight: 900, textAlign: "left", cursor: picked !== null ? "default" : "pointer",
                color: INK, background: bg, border: `2px solid ${bd}`, borderRadius: 10, padding: "10px 13px",
              }}>{c}{correct ? "　⭕" : chosen ? "　❌" : ""}</button>
            );
          })}
        </div>
      </div>
      {picked !== null && (
        <div style={{ marginTop: 10, fontSize: 12.5, fontWeight: 800, color: isOK ? GREEN : "#D85A30", background: "#fff", border: `1.5px dashed ${isOK ? GREEN : "#D85A30"}`, borderRadius: 9, padding: "9px 12px", lineHeight: 1.5 }}>
          {isOK ? "⭕ せいかい！　" : "❌ おしい…　"}{q.explain}
        </div>
      )}
      <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
        {picked !== null && <button onClick={next} style={btnMain(GREEN)}>つぎの問題 →</button>}
      </div>
    </div>
  );
}

/* ===== ∞チャレンジ問題：ジェネレータ登録制 =====
   新しい無限問題を 足すとき：
   ①上のように メーカー関数を作る（{display, choices, ansIndex, explain} を返す）
   ②下の GENERATORS に  キー: コンポーネント  を 1行 追加
   ③単元データの NEXT_CARDS で その カードに  gen:"キー"  を 指定する */
const GENERATORS = {
  symbol: () => <InfiniteChoiceQuiz make={makeSymbolQ} />,
  houi: () => <InfiniteChoiceQuiz make={makeHouiQ} />,
  chiiki: () => <InfiniteChoiceQuiz make={makeChiikiMapQ} />,
  compass: () => <InfiniteChoiceQuiz make={makeCompassQ} />,
  map: () => <InfiniteChoiceQuiz make={makeMapQ} />,
  houiMix: () => <InfiniteChoiceQuiz make={makeHouiMix} />,
  mapMix: () => <InfiniteChoiceQuiz make={makeMapMix} />,
  mixAll: () => <InfiniteChoiceQuiz make={makeMixAll} />,
};

/* ===== PBL ゲームの色 ===== */
const SYM_COLOR = "#6E5DA8";    // 地図記号マスター（藤むらさき＝宝石パレット）
const HOUI_COLOR = "#4E7A8B";   // 方位ナビ（錆浅葱）
const CHIIKI_COLOR = "#2F8B68"; // 奈良市たんけん（深緑）
const MAP_COLOR = "#B05E32";    // 絵地図の読み取り（銅・赤錆）
const TEST_COLOR = "#8A5A2B";   // たしかめテスト（まとめ＝深い金茶／ゴール）

/* ===== PBL：選択式ゲーム（記号マスター／方位ナビ／奈良市たんけん 共通エンジン） ===== */
function SocialGame({ title, emoji, color, subtitle, goal, make, onClose }) {
  const TOTAL = 10;
  const [idx, setIdx] = useState(1);
  const [q, setQ] = useState(make);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [finished, setFinished] = useState(false);

  const choose = (k) => {
    if (picked !== null) return;
    setPicked(k);
    if (k === q.ansIndex) setScore((s) => s + 1);
  };
  const next = () => {
    if (idx >= TOTAL) { setFinished(true); return; }
    setIdx((i) => i + 1); setQ(make()); setPicked(null);
  };
  const restart = () => { setIdx(1); setScore(0); setQ(make()); setPicked(null); setFinished(false); };

  const stars = score >= 9 ? 3 : score >= 7 ? 2 : score >= 5 ? 1 : 0;
  const rank = score >= 9 ? "たんけん名人！" : score >= 7 ? "よく できました！" : score >= 5 ? "あと もう少し！" : "もう一回 チャレンジ！";
  const isOK = picked !== null && picked === q.ansIndex;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(20,30,34,.5)", display: "grid", placeItems: "center", zIndex: 60, padding: 16 }}
      onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "min(560px,96vw)", maxHeight: "92vh", overflow: "auto", background: "#fff", borderRadius: 18, boxShadow: "0 18px 50px rgba(0,0,0,.3)" }}>
        {/* ヘッダー */}
        <div style={{ background: `linear-gradient(180deg, ${color}, ${color}dd)`, color: "#fff", padding: "14px 18px", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <span style={{ fontSize: 26 }}>{emoji}</span>
          <div style={{ flex: 1, minWidth: 180 }}>
            <div style={{ fontSize: 11, fontWeight: 800, opacity: .92 }}>{goal}</div>
            <div style={{ fontSize: 20, fontWeight: 900 }}>{title}</div>
            <div style={{ fontSize: 11, fontWeight: 800, opacity: .92, marginTop: 1 }}>{subtitle}</div>
          </div>
          <button onClick={onClose} style={{ fontSize: 13, fontWeight: 900, cursor: "pointer", color: "#fff", background: "rgba(255,255,255,.22)", border: "none", borderRadius: 10, padding: "7px 14px" }}>✕ とじる</button>
        </div>

        <div style={{ padding: "16px 18px" }}>
          {finished ? (
            <div style={{ textAlign: "center", padding: "12px 0" }}>
              <div style={{ fontSize: 34, letterSpacing: 4 }}>{"★★★".slice(0, stars).padEnd(3, "☆")}</div>
              <div style={{ fontSize: 22, fontWeight: 900, color, marginTop: 8 }}>{score} / {TOTAL} せいかい！</div>
              <div style={{ fontSize: 15, fontWeight: 900, color: INK, marginTop: 6 }}>{rank}</div>
              <div style={{ marginTop: 16, display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                <button onClick={restart} style={{ fontSize: 14, fontWeight: 900, cursor: "pointer", color: "#fff", background: color, border: "none", borderRadius: 11, padding: "11px 22px" }}>もう一回</button>
                <button onClick={onClose} style={{ fontSize: 14, fontWeight: 900, cursor: "pointer", color: SUB, background: "#fff", border: "1.5px solid #cdd8dd", borderRadius: 11, padding: "11px 22px" }}>とじる</button>
              </div>
            </div>
          ) : (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 900, color: SUB, marginBottom: 10 }}>
                <span>第 <b style={{ color }}>{idx}</b> / {TOTAL} もん</span>
                <span>せいかい：<b style={{ color: GREEN_TX }}>{score}</b></span>
              </div>
              <div style={{ background: "#F6F4FB", border: `2px solid ${color}`, borderRadius: 12, padding: "16px 14px" }}>
                {q.scene && <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}>{q.scene}</div>}
                <div style={{ fontSize: 16, fontWeight: 900, color: INK, lineHeight: 1.55, whiteSpace: "pre-line", textAlign: "center" }}>{q.display}</div>
                <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
                  {q.choices.map((c, k) => {
                    const chosen = picked === k;
                    const correct = picked !== null && k === q.ansIndex;
                    const bg = correct ? "#E7F6EF" : chosen ? "#FCE9E2" : "#fff";
                    const bd = correct ? GREEN : chosen ? "#D85A30" : "#d3dde1";
                    return (
                      <button key={k} onClick={() => choose(k)} disabled={picked !== null} style={{
                        fontSize: 15.5, fontWeight: 900, textAlign: "left", cursor: picked !== null ? "default" : "pointer",
                        color: INK, background: bg, border: `2px solid ${bd}`, borderRadius: 11, padding: "12px 14px",
                      }}>{c}{correct ? "　⭕" : chosen ? "　❌" : ""}</button>
                    );
                  })}
                </div>
              </div>
              {picked !== null && (
                <div style={{ marginTop: 11, fontSize: 13, fontWeight: 800, color: isOK ? GREEN : "#D85A30", background: "#fff", border: `1.5px dashed ${isOK ? GREEN : "#D85A30"}`, borderRadius: 10, padding: "10px 13px", lineHeight: 1.55 }}>
                  {isOK ? "⭕ せいかい！　" : "❌ おしい…　"}{q.explain}
                </div>
              )}
              {picked !== null && (
                <button onClick={next} style={{ marginTop: 12, width: "100%", fontSize: 15, fontWeight: 900, cursor: "pointer", color: "#fff", background: color, border: "none", borderRadius: 11, padding: "12px 0" }}>
                  {idx >= TOTAL ? "けっかを 見る →" : "つぎの もんだい →"}
                </button>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function AnsField({ label, unit, value, onChange, ok }) {
  const border = ok === null ? "#cdd8dd" : ok ? GREEN : "#D85A30";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <span style={{ fontSize: 12.5, fontWeight: 800, color: INK, width: 70, flex: "none" }}>{label}</span>
      <input type="number" value={value} onChange={(e) => onChange(e.target.value)} placeholder="答え"
        style={{ flex: 1, minWidth: 0, fontSize: 17, fontWeight: 900, color: INK, textAlign: "right", border: `2px solid ${border}`, borderRadius: 9, padding: "6px 9px", outline: "none" }} />
      <span style={{ fontSize: 13, fontWeight: 900, flex: "none" }}>{unit}</span>
      {ok !== null && <span style={{ fontSize: 17, fontWeight: 900, color: ok ? GREEN : "#D85A30", width: 18, flex: "none" }}>{ok ? "○" : "×"}</span>}
    </div>
  );
}
function Row({ label, value, color, big }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: big ? "3px 0" : "2px 0" }}>
      <span style={{ fontSize: big ? 12.5 : 11, fontWeight: 800, color: color }}>{label}</span>
      <span style={{ fontSize: big ? 19 : 13, fontWeight: 900, color: color }}>{value}</span>
    </div>
  );
}

/* 「つまずきレスキュー隊」カードの色（旧ミニ授業ボード由来の名残） */

function SectionTitle({ color, icon, text, mt }) {

}

<script>
/* ⭐ 星空：ランダムに星をちりばめて、ゆっくりまたたく（reduced-motionでは静止） */
(function(){
  var s=document.getElementById("stars"); if(!s) return;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var n=reduce?40:78, frag=document.createDocumentFragment();
  for(var i=0;i<n;i++){
    var st=document.createElement("i");
    var sz=Math.random()*2+1;
    st.style.width=sz+"px"; st.style.height=sz+"px";
    st.style.left=(Math.random()*100)+"%"; st.style.top=(Math.random()*100)+"%";
    st.style.opacity=(Math.random()*.5+.3).toFixed(2);
    if(!reduce){ st.style.animationDelay=(Math.random()*3.6)+"s"; st.style.animationDuration=(Math.random()*2.5+2.6)+"s"; }
    else { st.style.animation="none"; }
    frag.appendChild(st);
  }
  s.appendChild(frag);
})();
</script>
<script>
/* 🌌 オーロラ：マウスの跡を数珠つなぎのぼかし玉が追いかけ、星雲のしっぽになる。
   - pointermove(マウス/トラックパッド)に追従。touchは無視
   - 3.5秒なにもないと「ひとり旅モード」でゆっくり漂う(タブレットでも生きる)
   - prefers-reduced-motion では起動しない */
(function(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var au=document.getElementById("aurora"); if(!au) return;
  var blobs=[].slice.call(au.children); if(!blobs.length) return;
  var halves=blobs.map(function(b){return b.offsetWidth/2;});
  var pts=blobs.map(function(){return {x:innerWidth/2,y:innerHeight*0.38,o:0};});
  var mx=innerWidth/2,my=innerHeight*0.38,idle=99,t=0,last=performance.now();
  addEventListener("pointermove",function(e){
    if(e.pointerType==="touch") return;
    mx=e.clientX; my=e.clientY; idle=0;
  },{passive:true});
  function frame(now){
    var dt=Math.min((now-last)/1000,.05); last=now; t+=dt; idle+=dt;
    var tx=mx, ty=my;
    if(idle>3.5){ /* ひとり旅 */
      tx=innerWidth *(0.50+0.34*Math.sin(t*0.21));
      ty=innerHeight*(0.40+0.24*Math.cos(t*0.15));
    }
    for(var i=0;i<blobs.length;i++){
      var p=pts[i], g= i===0 ? {x:tx,y:ty} : pts[i-1];
      var k= i===0 ? .20 : .26;
      p.x+=(g.x-p.x)*k; p.y+=(g.y-p.y)*k;
      var oT= idle>3.5 ? .55-(i*.06) : .95-(i*.11);
      p.o+=(oT-p.o)*.045;
      blobs[i].style.transform="translate3d("+(p.x-halves[i])+"px,"+(p.y-halves[i])+"px,0)";
      blobs[i].style.opacity=p.o.toFixed(3);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
